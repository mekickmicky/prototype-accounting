services:
  postgres:
    image: postgres:16-alpine
    container_name: wind-acc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wind
      POSTGRES_PASSWORD: wind_dev
      POSTGRES_DB: wind_accounting
      TZ: Asia/Bangkok
    ports:
      # Host port 5433 (5432 reserved for any host-installed Postgres on the dev machine)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wind -d wind_accounting"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wind-acc-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wind.dev
      PGADMIN_DEFAULT_PASSWORD: wind_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  langfuse-db:
    image: postgres:16-alpine
    container_name: wind-acc-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: wind-acc-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3030:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse_dev@langfuse-db:5432/langfuse"
      NEXTAUTH_SECRET: "wind-acc-dev-only-nextauth-secret-changeme"
      SALT: "wind-acc-dev-only-salt-changeme"
      NEXTAUTH_URL: "http://localhost:3030"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

volumes:
  postgres_data:
  pgadmin_data:
  langfuse_db_data:
